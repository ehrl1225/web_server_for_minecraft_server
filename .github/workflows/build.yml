name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Minecraft Server Controller EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --frozen --dev

      - name: Run tests
        run: |
          uv run pytest

      - name: Build executable with PyInstaller
        run: |
          uv run pyinstaller --noconfirm --onefile --console --name "MinecraftServerController" --add-data "src/templates;src/templates" --collect-all uvicorn --collect-all fastapi --collect-all starlette main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftServerController-Windows
          path: dist/MinecraftServerController.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MinecraftServerController.exe
          generate_release_notes: true
